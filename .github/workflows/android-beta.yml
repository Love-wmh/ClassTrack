name: Android Beta Release

# 编译 Android 客户端并自动发布测试版（GitHub prerelease）。
#
# 触发方式：
#   - 手动：Actions → Android Beta Release → Run workflow（可附一句说明）
#   - 自动：merge 进 master 且改动涉及 App 产物时（docs/、.trellis/ 这类纯文档改动不会触发）
#
# 产物：签名 release APK（配好 secrets 时）或 debug APK（未配时，会在日志里给出警告）。
# 版本号取自 Actions 的 run_number，因此每个测试版都能覆盖安装到上一个测试版上。

on:
  workflow_dispatch:
    inputs:
      note:
        description: 本次测试版的补充说明（可选，会写进 release 正文）
        required: false
        default: ''
        type: string
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'app/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-beta.yml'

# 同一分支上只保留最新的测试版任务：后一次合并先到先发，避免旧 commit 的包覆盖新包。
concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

# 创建 release 需要写权限；其余权限一律不给。
permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成 release 说明时要对比上一个测试版标签，因此需要完整历史与标签。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 仓库要求 JDK 21（AGP 8.13 按本机 JDK 产出字节码，Kotlin 侧用 jvmToolchain(21) 对齐）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 不引入额外的 setup-android action：runner 镜像自带 Android SDK，这里只补缺失的平台与构建工具。
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "sdk.dir=$SDK" > android/local.properties

      - run: pnpm install --frozen-lockfile

      # 先把 Web 产物构建并同步进 android/app/src/main/assets/public，再编译 APK。
      - name: 构建 Web 产物并同步到 Android 工程
        run: pnpm cap:sync:android

      - name: 原生单元测试
        run: ./android/gradlew -p android :app:testDebugUnitTest

      # 密钥只从 Secrets 读：仓库与产物里都不落任何凭据。未配置时退回 debug 包，保证工作流今天就能用。
      - name: 准备签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/classtrack-beta.jks"
            echo "store_file=$RUNNER_TEMP/classtrack-beta.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD，本次发布 debug APK；补上这四个 Secrets 后即自动切换为签名 release 包。"
          fi

      - name: 编译 APK
        id: build
        env:
          CLASSTRACK_KEYSTORE_FILE: ${{ steps.signing.outputs.store_file }}
          CLASSTRACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLASSTRACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLASSTRACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # run_number 单调递增，测试机因此可以覆盖安装上一个测试版。
          CLASSTRACK_VERSION_CODE: ${{ github.run_number }}
          CLASSTRACK_VERSION_NAME: 1.0.${{ github.run_number }}-beta
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./android/gradlew -p android :app:assembleRelease
            APK=android/app/build/outputs/apk/release/app-release.apk
          else
            ./android/gradlew -p android :app:assembleDebug
            APK=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$APK"
          # 资源一致性必须校验「本次要发布的那个包」——脚本默认只看 debug 包，因此显式传入路径。
          CLASS_TRACK_ANDROID_APK_PATH="$APK" pnpm android:check-assets
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: 发布测试版
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          TAG="android-beta-${{ github.run_number }}"
          VERSION="1.0.${{ github.run_number }}-beta"

          # 上一个测试版标签用于生成「本次改动」列表；没有则为空。
          PREV="$(gh release list --limit 50 --json tagName \
            --jq '[.[] | select(.tagName | startswith("android-beta-"))][0].tagName // empty' || true)"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log --pretty='- %s (%h)' "${PREV}..HEAD" || true)"
          else
            CHANGES="$(git log --pretty='- %s (%h)' -20 || true)"
          fi

          if [ "$SIGNED" = "true" ]; then
            SIGN_TEXT="签名 release 包（v2 签名），可直接覆盖安装上一个测试版。"
          else
            SIGN_TEXT="debug 包：仓库尚未配置发布签名 Secrets。若测试机上已装过签名 release 包，需要先卸载再安装。"
          fi

          {
            echo "ClassTrack Android 测试版 **${VERSION}**"
            echo
            echo "- commit: \`$(git rev-parse --short HEAD)\`"
            echo "- 包类型：${SIGN_TEXT}"
            echo "- 下载 \`ClassTrack-beta-latest.apk\` 永远指向本页这个包。"
            if [ -n "$NOTE" ]; then
              echo
              echo "## 说明"
              echo
              echo "$NOTE"
            fi
            echo
            echo "## 本次改动"
            echo
            echo "${CHANGES:-(无)}"
          } > "$RUNNER_TEMP/notes.md"

          cp "${{ steps.build.outputs.apk }}" "ClassTrack-beta-${VERSION}.apk"
          cp "${{ steps.build.outputs.apk }}" ClassTrack-beta-latest.apk

          gh release create "$TAG" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "ClassTrack Android ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "ClassTrack-beta-${VERSION}.apk" \
            ClassTrack-beta-latest.apk

      # 测试版会随每次合并累积；只保留最近 10 个，避免测试者在一堆旧包里挑。
      - name: 清理过期测试版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("android-beta-"))] | .[10:] | .[].tagName' |
            while read -r tag; do
              [ -n "$tag" ] || continue
              echo "删除过期测试版 $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
