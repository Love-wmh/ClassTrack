name: Android Release

# 编译 Android 客户端并发布到 GitHub Releases。两条互不干扰的轨道：
#
#   测试版（prerelease，不占用 Latest）：
#     - 自动：merge 进 master 且改动可能影响 APK 时（路径过滤见 on.push.paths）
#     - 手动：Actions → Android Release → Run workflow（release_kind 保持 beta，可附一句说明）
#     - 版本号：1.0.<序号>-beta，标签 android-beta-<序号>（序号 = 已有测试版标签的最大值 + 1），
#       只保留最近 10 个
#
#   正式版（非 prerelease，标记 Latest）：
#     - **只能手动触发**：Actions → Android Release → Run workflow → release_kind 选 stable、
#       并填写版本号（如 1.2.0）。tag push 不会触发发布 —— 发布步骤自己创建 tag v<版本号>。
#     - 版本号：来自 dispatch 输入；tag 就是 v<版本号>；不参与测试版的数量清理
#     - 发布前必须满足：该提交在 master 上、版本号形如 X.Y.Z、tag v<版本号> 尚不存在
#
# 两条轨道都必须发**签名**包：仓库 Secrets 里没有签名凭据时工作流直接失败，不再回退 debug 包
# （debug 与 release 签名不同，装过 debug 包的测试机无法原地升级、只能卸载重装，会丢数据）。
# 签名凭据与本地出签名包的配置见 README「发布与签名」段。
#
# 版本号规则：
# - versionName 按轨道取值：测试版 1.0.<序号>-beta，正式版取 tag 去掉前缀 v。
# - versionCode 一律取 epoch 秒。**不要用 run_number**：它是「每个 workflow 各自计数」的，
#   重命名 workflow 文件（本仓库 2026-09-20 就把 android-beta.yml 改名为 android-release.yml）
#   会让它归零，于是新 workflow 的 run_number=1 与既有 android-beta-1 撞名、发布直接失败；
#   而且重命名后新序号可能小于测试机已安装的版本，覆盖安装会被系统拒绝。
#   epoch 秒跨轨道、跨重命名都单调递增，也不需要任何外部状态（32 位 versionCode 直到 2038 年都放得下）。
# - 测试版标签序号取自 `gh release list` 里 android-beta-<n> 的最大值，因此与 run_number 无关。
#
# 路径过滤的判据：凡是能改变 APK 内容，或改变它如何被构建/校验的路径都算；纯文档
# （docs/**、.trellis/**、README、AGENTS.md）改动不发版。

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: '发布类型：beta = 测试版（预发布）；stable = 正式版（标记 Latest，需填版本号）'
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      version:
        description: '仅 stable 需要：版本号，形如 1.2.0（发布时会创建 tag v1.2.0）'
        required: false
        default: ''
        type: string
      note:
        description: 补充说明（可选，会写进 release 正文）
        required: false
        default: ''
        type: string
  push:
    branches: [master]
    paths:
      # 产物来源
      - 'app/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      # 构建与发布链路本身
      - '.github/**'
      # 决定产物内容或产物如何被打包/校验的根配置
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'react-router.config.ts'
      - 'tsconfig.json'
      - 'index.html'

# 同一分支/标签上只保留最新任务：后一次先到先发，避免旧 commit 的包覆盖新包。
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

# 创建 release 需要写权限；其余权限一律不给。
permissions:
  contents: write

env:
  # 只有手动 dispatch 并显式选择 stable 才走正式版轨道；master push 与默认 dispatch 都是测试版。
  IS_STABLE: ${{ inputs.release_kind == 'stable' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成 release 说明时要对比上一个发布标签，因此需要完整历史与标签。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 仓库要求 JDK 21（AGP 8.13 按本机 JDK 产出字节码，Kotlin 侧用 jvmToolchain(21) 对齐）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 不引入额外的 setup-android action：runner 镜像自带 Android SDK，这里只补缺失的平台与构建工具。
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "sdk.dir=$SDK" > android/local.properties

      - run: pnpm install --frozen-lockfile

      # 先把 Web 产物构建并同步进 android/app/src/main/assets/public，再编译 APK。
      - name: 构建 Web 产物并同步到 Android 工程
        run: pnpm cap:sync:android

      - name: 原生单元测试
        run: ./android/gradlew -p android :app:testDebugUnitTest

      # 密钥只从 Secrets 读：仓库与产物里都不落任何凭据。未配置时测试版退回 debug 包，
      # 正式版则由下一步直接失败 —— 正式版绝不发未签名包。
      - name: 准备签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # 没有签名凭据就直接失败：debug 包与 release 包签名不同，测试机无法原地升级，
          # 只能卸载重装（丢数据），所以两条轨道都不允许再回退 debug 包。
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::缺少签名 Secrets：ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD。配置方法见 README「发布与签名」段。"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/classtrack-release.jks"
          echo "store_file=$RUNNER_TEMP/classtrack-release.jks" >> "$GITHUB_OUTPUT"

      # 签名三项（storePassword / keyPassword / keyAlias）由 build.gradle 直接读环境变量；
      # 这里先断言都存在，避免构建到一半才发现签名配置没注册。

      - name: 校验正式版发布条件
        if: env.IS_STABLE == 'true'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 版本号来自手动 dispatch 输入（tag 不再触发发布，发布时由工作流创建 tag）。
          VERSION="${INPUT_VERSION#v}"
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::正式版需要形如 1.2.0 的版本号（当前输入：${INPUT_VERSION:-空}）"
            exit 1
          fi
          # 只从 master 上的提交发布正式版，避免把某个分支的试验提交变成 Latest 版本。
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::本次运行的提交不在 master 上，拒绝发布正式版"
            exit 1
          fi
          # 已发布的正式版不许被覆盖。
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION} 已存在，请换一个版本号"
            exit 1
          fi

      - name: 计算版本号与标签
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # epoch 秒单调递增，测试机因此可以一路覆盖安装（beta → 正式版 → beta）。
          echo "code=$(date +%s)" >> "$GITHUB_OUTPUT"

          if [ "${IS_STABLE}" = "true" ]; then
            echo "name=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "tag=v${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            # 已有测试版标签里的最大序号 + 1；与 run_number 无关，重命名 workflow 也不会撞名。
            LAST_INDEX="$(gh release list --limit 100 --json tagName \
              --jq '[.[] | select(.tagName | test("^android-beta-[0-9]+$")) | (.tagName | sub("^android-beta-"; "") | tonumber)] | max // 0')"
            # 显式校验：$(( )) 遇到非纯数字会报成 "unbound variable"，那种信息对排查没有帮助。
            case "${LAST_INDEX}" in
              '' | *[!0-9]*)
                echo "::error::解析已有测试版序号失败，拿到的是 ${LAST_INDEX:-空}"
                exit 1
                ;;
            esac
            NEXT_INDEX=$((LAST_INDEX + 1))
            echo "name=1.0.${NEXT_INDEX}-beta" >> "$GITHUB_OUTPUT"
            echo "tag=android-beta-${NEXT_INDEX}" >> "$GITHUB_OUTPUT"
            echo "上一次测试版序号=${LAST_INDEX}，本次=${NEXT_INDEX}"
          fi

          echo "version=$(grep '^name=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "tag=$(grep '^tag=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: 编译 APK
        id: build
        env:
          CLASSTRACK_VERSION_CODE: ${{ steps.version.outputs.code }}
          CLASSTRACK_VERSION_NAME: ${{ steps.version.outputs.name }}
          CLASSTRACK_KEYSTORE_FILE: ${{ steps.signing.outputs.store_file }}
          CLASSTRACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLASSTRACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLASSTRACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "版本号：${CLASSTRACK_VERSION_NAME}（versionCode=${CLASSTRACK_VERSION_CODE}）"

          # 三个签名相关环境变量必须齐备，否则 build.gradle 不会注册 signingConfigs.release，
          # assembleRelease 产出的是未签名包、下面的路径也就取不到。
          for name in CLASSTRACK_KEYSTORE_FILE CLASSTRACK_KEYSTORE_PASSWORD CLASSTRACK_KEY_ALIAS CLASSTRACK_KEY_PASSWORD; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "::error::环境变量 ${name} 为空，无法产出签名包"
              exit 1
            fi
          done

          ./android/gradlew -p android :app:assembleRelease
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          # 资源一致性必须校验「本次要发布的那个包」——脚本默认只看 debug 包，因此显式传入路径。
          CLASS_TRACK_ANDROID_APK_PATH="$APK" pnpm android:check-assets
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # TAG 由「计算版本号与标签」步骤给出（测试版是自动迭代的序号，正式版是 v<手动输入的版本号>）。
          # 这里只为生成「本次改动」列表找上一个同轨道标签；没有则为空。
          if [ "${IS_STABLE}" = "true" ]; then
            PREV="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
            ASSET="ClassTrack-${VERSION}.apk"
          else
            PREV="$(gh release list --limit 50 --json tagName \
              --jq '[.[] | select(.tagName | startswith("android-beta-"))][0].tagName // empty' || true)"
            ASSET="ClassTrack-beta-${VERSION}.apk"
          fi

          if [ -n "$PREV" ]; then
            CHANGES="$(git log --pretty='- %s (%h)' "${PREV}..HEAD" || true)"
          else
            CHANGES="$(git log --pretty='- %s (%h)' -20 || true)"
          fi

          {
            echo "ClassTrack Android **${VERSION}**"
            echo
            echo "- commit: \`$(git rev-parse --short HEAD)\`"
            echo "- 包类型：签名 release 包，可直接覆盖安装上一个版本（数据保留）。"
            if [ "${IS_STABLE}" = "true" ]; then
              echo "- 正式版：手动触发发布，对应 \`master\` 上的提交，已创建 tag \`${TAG}\`。"
            else
              echo "- 下载 \`ClassTrack-beta-latest.apk\` 永远指向本页这个包。"
            fi
            if [ -n "${NOTE}" ]; then
              echo
              echo "## 说明"
              echo
              echo "${NOTE}"
            fi
            echo
            echo "## 本次改动"
            echo
            echo "${CHANGES:-(无)}"
          } > "$RUNNER_TEMP/notes.md"

          cp "${{ steps.build.outputs.apk }}" "${ASSET}"

          if [ "${IS_STABLE}" = "true" ]; then
            # 正式版是手动触发的，tag 尚不存在：由 gh 按 --target 指向本次运行的提交来创建，
            # 这样「发布」与「打 tag」一步完成，不需要人工 git tag && git push。
            gh release create "$TAG" \
              --latest \
              --target "${{ github.sha }}" \
              --title "ClassTrack Android ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${ASSET}"
          else
            cp "${{ steps.build.outputs.apk }}" ClassTrack-beta-latest.apk
            gh release create "$TAG" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "ClassTrack Android ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${ASSET}" \
              ClassTrack-beta-latest.apk
          fi

      # 测试版会随每次合并累积；只保留最近 10 个，避免测试者在一堆旧包里挑。正式版不清理。
      - name: 清理过期测试版
        if: env.IS_STABLE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("android-beta-"))] | .[10:] | .[].tagName' |
            while read -r tag; do
              [ -n "$tag" ] || continue
              echo "删除过期测试版 $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
