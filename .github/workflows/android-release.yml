name: Android Release

# 编译 Android 客户端并发布到 GitHub Releases。两条互不干扰的轨道：
#
#   测试版（prerelease，不占用 Latest）：
#     - 自动：merge 进 master 且改动可能影响 APK 时（路径过滤见 on.push.paths）
#     - 手动：Actions → Android Release → Run workflow（可附一句说明）
#     - 版本号：1.0.<run_number>-beta，标签 android-beta-<run_number>，只保留最近 10 个
#
#   正式版（非 prerelease，标记 Latest）：
#     - 自动：push 形如 v1.2.3 的 tag（GitHub 对 tag push 不评估路径过滤）
#     - 版本号：取 tag 去掉前缀 v；标签就是该 tag；不参与测试版的数量清理
#     - 必须配好签名 Secrets 且 tag 指向 master 上的提交，否则直接失败
#
# 版本号规则：versionName 按轨道取值，versionCode 一律用 run_number —— 它在两条轨道之间
# 单调递增，测试机才能一路覆盖安装（beta → 正式版 → beta）。
#
# 路径过滤的判据：凡是能改变 APK 内容，或改变它如何被构建/校验的路径都算；纯文档
# （docs/**、.trellis/**、README、AGENTS.md）改动不发版。

on:
  workflow_dispatch:
    inputs:
      note:
        description: 本次测试版的补充说明（可选，会写进 release 正文）
        required: false
        default: ''
        type: string
  push:
    branches: [master]
    paths:
      # 产物来源
      - 'app/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/**'
      # 构建与发布链路本身
      - '.github/**'
      # 决定产物内容或产物如何被打包/校验的根配置
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'react-router.config.ts'
      - 'tsconfig.json'
      - 'index.html'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# 同一分支/标签上只保留最新任务：后一次先到先发，避免旧 commit 的包覆盖新包。
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

# 创建 release 需要写权限；其余权限一律不给。
permissions:
  contents: write

env:
  # tag push 走正式版轨道，master push 与手动 dispatch 走测试版轨道。
  IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成 release 说明时要对比上一个发布标签，因此需要完整历史与标签。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 仓库要求 JDK 21（AGP 8.13 按本机 JDK 产出字节码，Kotlin 侧用 jvmToolchain(21) 对齐）。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 不引入额外的 setup-android action：runner 镜像自带 Android SDK，这里只补缺失的平台与构建工具。
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "sdk.dir=$SDK" > android/local.properties

      - run: pnpm install --frozen-lockfile

      # 先把 Web 产物构建并同步进 android/app/src/main/assets/public，再编译 APK。
      - name: 构建 Web 产物并同步到 Android 工程
        run: pnpm cap:sync:android

      - name: 原生单元测试
        run: ./android/gradlew -p android :app:testDebugUnitTest

      # 密钥只从 Secrets 读：仓库与产物里都不落任何凭据。未配置时测试版退回 debug 包，
      # 正式版则由下一步直接失败 —— 正式版绝不发未签名包。
      - name: 准备签名密钥
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/classtrack-release.jks"
            echo "store_file=$RUNNER_TEMP/classtrack-release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD，本次发布 debug APK；补上这四个 Secrets 后即自动切换为签名 release 包。"
          fi

      - name: 校验正式版发布条件
        if: env.IS_STABLE == 'true'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          # 触发用的 tag 模式见 on.push.tags；这里再校验一次格式，避免各种过滤语义差异把
          # v1.2.3-rc 之类的前缀式标签当成正式版发布。
          if ! printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag ${GITHUB_REF_NAME} 不是 v<major>.<minor>.<patch> 形式，拒绝发布正式版"
            exit 1
          fi
          # 只从 master 上的提交发布正式版，避免把分支上的试验 tag 变成 Latest 版本。
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag ${GITHUB_REF_NAME} 指向的提交不在 master 上，拒绝发布正式版"
            exit 1
          fi
          if [ "${SIGNED}" != "true" ]; then
            echo "::error::正式版必须使用签名包：请配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 四个 Secrets"
            exit 1
          fi

      - name: 编译 APK
        id: build
        env:
          CLASSTRACK_KEYSTORE_FILE: ${{ steps.signing.outputs.store_file }}
          CLASSTRACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLASSTRACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLASSTRACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${IS_STABLE}" = "true" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}-beta"
          fi
          # run_number 单调递增，测试机因此可以覆盖安装上一个测试版或上一个正式版。
          export CLASSTRACK_VERSION_CODE="${GITHUB_RUN_NUMBER}"
          export CLASSTRACK_VERSION_NAME="${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./android/gradlew -p android :app:assembleRelease
            APK=android/app/build/outputs/apk/release/app-release.apk
          else
            ./android/gradlew -p android :app:assembleDebug
            APK=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$APK"
          # 资源一致性必须校验「本次要发布的那个包」——脚本默认只看 debug 包，因此显式传入路径。
          CLASS_TRACK_ANDROID_APK_PATH="$APK" pnpm android:check-assets
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          NOTE: ${{ inputs.note }}
          VERSION: ${{ steps.build.outputs.version_name }}
        run: |
          set -euo pipefail

          # 上一个同轨道发布标签，用于生成「本次改动」列表；没有则为空。
          if [ "${IS_STABLE}" = "true" ]; then
            TAG="${GITHUB_REF_NAME}"
            PREV="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
            ASSET="ClassTrack-${VERSION}.apk"
          else
            TAG="android-beta-${GITHUB_RUN_NUMBER}"
            PREV="$(gh release list --limit 50 --json tagName \
              --jq '[.[] | select(.tagName | startswith("android-beta-"))][0].tagName // empty' || true)"
            ASSET="ClassTrack-beta-${VERSION}.apk"
          fi

          if [ -n "$PREV" ]; then
            CHANGES="$(git log --pretty='- %s (%h)' "${PREV}..HEAD" || true)"
          else
            CHANGES="$(git log --pretty='- %s (%h)' -20 || true)"
          fi

          if [ "${SIGNED}" = "true" ]; then
            SIGN_TEXT="签名 release 包（v2 签名），可直接覆盖安装上一个版本。"
          else
            SIGN_TEXT="debug 包：仓库尚未配置发布签名 Secrets。若测试机上已装过签名 release 包，需要先卸载再安装。"
          fi

          {
            echo "ClassTrack Android **${VERSION}**"
            echo
            echo "- commit: \`$(git rev-parse --short HEAD)\`"
            echo "- 包类型：${SIGN_TEXT}"
            if [ "${IS_STABLE}" = "true" ]; then
              echo "- 由 tag \`${TAG}\` 触发，对应 \`master\` 上的正式版本。"
            else
              echo "- 下载 \`ClassTrack-beta-latest.apk\` 永远指向本页这个包。"
            fi
            if [ -n "${NOTE}" ]; then
              echo
              echo "## 说明"
              echo
              echo "${NOTE}"
            fi
            echo
            echo "## 本次改动"
            echo
            echo "${CHANGES:-(无)}"
          } > "$RUNNER_TEMP/notes.md"

          cp "${{ steps.build.outputs.apk }}" "${ASSET}"

          if [ "${IS_STABLE}" = "true" ]; then
            # 正式版的 tag 已由推送创建：--verify-tag 让 gh 在找不到该 tag 时直接失败，
            # 而不是把它指到默认分支的 HEAD 上。
            gh release create "$TAG" \
              --latest \
              --verify-tag \
              --title "ClassTrack Android ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${ASSET}"
          else
            cp "${{ steps.build.outputs.apk }}" ClassTrack-beta-latest.apk
            gh release create "$TAG" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "ClassTrack Android ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${ASSET}" \
              ClassTrack-beta-latest.apk
          fi

      # 测试版会随每次合并累积；只保留最近 10 个，避免测试者在一堆旧包里挑。正式版不清理。
      - name: 清理过期测试版
        if: env.IS_STABLE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("android-beta-"))] | .[10:] | .[].tagName' |
            while read -r tag; do
              [ -n "$tag" ] || continue
              echo "删除过期测试版 $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
