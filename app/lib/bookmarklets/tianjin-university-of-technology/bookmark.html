<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>保存书签脚本</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #dbe3ef;
      --code: #0f172a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #e0ecff 0, var(--bg) 45%, #eef2ff 100%);
    }

    main {
      width: min(720px, 100%);
      padding: 36px;
      border: 1px solid rgba(219, 227, 239, 0.9);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 28px 0;
    }

    .bookmarklet,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--primary);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.24);
    }

    .bookmarklet:hover,
    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(37, 99, 235, 0.3);
    }

    button.secondary {
      color: var(--primary);
      background: #eaf1ff;
      box-shadow: none;
    }

    button.secondary:hover {
      background: #dbe8ff;
      box-shadow: none;
    }

    .tip {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #f8fbff;
      color: var(--muted);
    }

    code {
      display: block;
      max-height: 180px;
      overflow: auto;
      padding: 14px;
      border-radius: 14px;
      color: #dbeafe;
      background: var(--code);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main>
    <h1>教务课表抓取书签脚本</h1>
    <p>把下面的蓝色按钮拖到浏览器书签栏。登录教务系统并进入 jwxt.tjut.edu.cn 页面后点击书签，会按逆向出的接口请求课表数据，并在控制台打印完整响应。</p>

    <div class="actions">
      <a id="bookmarklet" class="bookmarklet" href="#">拖到书签栏保存</a>
      <button id="copyButton" type="button" class="secondary">复制书签脚本</button>
    </div>

    <p class="tip">如果看不到书签栏，可以先按 <strong>⌘ + Shift + B</strong> 显示书签栏。脚本需要在已登录的 <strong>jwxt.tjut.edu.cn</strong> 页面执行，浏览器会自动带上当前登录 Cookie。</p>

    <p>脚本内容：</p>
    <code id="scriptPreview"></code>
  </main>

  <script>
    const bookmarkletCode = `javascript:(async()=>{const api='/jwapp/sys/wdkb/modules/xskcb/cxxszhxqkb.do';const term=prompt('请输入学年学期代码：','2025-2026-2');if(!term)return;console.log('[课表书签] 开始请求',{api,term});try{const response=await fetch(api,{method:'POST',credentials:'include',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','X-Requested-With':'XMLHttpRequest','Accept':'application/json, text/javascript, */*; q=0.01'},body:new URLSearchParams({XNXQDM:term}).toString()});const text=await response.text();let data;try{data=JSON.parse(text)}catch(error){data=text}const rows=data?.datas?.cxxszhxqkb?.rows||[];console.log('[课表书签] 原始响应',data);console.table(rows.map(({KCM,SKJS,SKXQ_DISPLAY,KSJC_DISPLAY,JSJC_DISPLAY,JASMC,YPSJDD})=>({课程:KCM,教师:SKJS,星期:SKXQ_DISPLAY,开始节:KSJC_DISPLAY,结束节:JSJC_DISPLAY,教室:JASMC,安排:YPSJDD})));window.__jwxtCourseData=data;const filename='classtrack-course-'+term.replace(/[^0-9a-zA-Z_-]/g,'-')+'.json';const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('课表 JSON 已导出：'+filename)}catch(error){console.error('[课表书签] 请求失败',error);alert('请求失败，请确认已登录教务系统且在 jwxt.tjut.edu.cn 域名下执行。')}})()`;
    const bookmarklet = document.querySelector('#bookmarklet');
    const copyButton = document.querySelector('#copyButton');
    const scriptPreview = document.querySelector('#scriptPreview');

    bookmarklet.href = bookmarkletCode;
    scriptPreview.textContent = bookmarkletCode;

    copyButton.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(bookmarkletCode);
        copyButton.textContent = '已复制';
      } catch (error) {
        window.prompt('复制下面的书签脚本：', bookmarkletCode);
      }

      setTimeout(() => {
        copyButton.textContent = '复制书签脚本';
      }, 1800);
    });
  </script>
</body>
</html>
