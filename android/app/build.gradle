apply plugin: 'com.android.application'
// Kotlin 与 Compose 编译器插件的 classpath 由根 build.gradle 的 buildscript 提供。
// 桌面小工具用 Jetpack Glance 编写，Glance 是 Kotlin/Compose API，因此本模块不再是纯 Java。
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// ---------------------------------------------------------------------------
// 发布签名与版本号：只从环境变量读取，仓库里不放任何凭据。
//
// 这四个变量由 CI（.github/workflows/android-beta.yml）从 GitHub Secrets 注入；本机构建不设置它们，
// 于是 `assembleRelease` 产出的是未签名 APK（无法安装），工作流会自动退回 debug 产物。
//
// 用环境变量而不是 `android.injected.signing.*`：注入签名依赖 AGP 内部行为，属未文档化路径；
// 这里显式声明，任何人 clone 下来都能看懂 beta 包是怎么签的。
// ---------------------------------------------------------------------------
def releaseStoreFile = System.getenv('CLASSTRACK_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('CLASSTRACK_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('CLASSTRACK_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CLASSTRACK_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// beta 包必须每次都递增 versionCode，否则测试机无法覆盖安装。
def injectedVersionCode = System.getenv('CLASSTRACK_VERSION_CODE')
def injectedVersionName = System.getenv('CLASSTRACK_VERSION_NAME')

android {
    namespace = "com.classtrack.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.classtrack.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode injectedVersionCode ? injectedVersionCode.toInteger() : 1
        versionName injectedVersionName ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 只有拿到密钥时才注册签名配置：否则 `signingConfigs.release` 不存在，buildTypes 里也无从引用。
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Java 与 Kotlin 必须使用同一个 jvmTarget，否则 KGP 直接报 Inconsistent JVM-target compatibility。
// 用 JVM toolchain 而不是 compileOptions：AGP 8.13 会用 toolchain 覆盖 compileOptions 的
// source/targetCompatibility，只写 compileOptions 不生效（实测 Java 任务仍是本机 JDK 版本）。
// 版本取自 variables.gradle 的 jvmTargetVersion，本仓库要求 JDK 21。
kotlin {
    jvmToolchain(rootProject.ext.jvmTargetVersion.toInteger())
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(rootProject.ext.jvmTargetVersion.toString())
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // 桌面小工具（Jetpack Glance）与刷新排程（WorkManager）
    implementation "androidx.glance:glance-appwidget:$glanceAppWidgetVersion"
    implementation "androidx.work:work-runtime-ktx:$androidxWorkVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
