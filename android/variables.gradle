ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // Android 桌面小工具依赖
    glanceAppWidgetVersion = '1.2.0'
    // 与 Glance 1.2.0 的传递版本保持一致：实测显式升到 2.11.2 会让 Glance 的
    // SessionWorker 反复被 cancel，provideContent 永不返回，桌面只显示 initialLayout。
    // 注意 Glance 把 WorkManager 声明为 runtime 作用域，因此仍需显式声明才能编译。
    androidxWorkVersion = '2.7.1'

    // Java 与 Kotlin 的 jvmTarget 必须一致，否则 KGP 会直接报错。
    // 取 21 是因为 AGP 8.13 默认就按本机 JDK 产出 Java 21 字节码，而 compileOptions 会被
    // toolchain 覆盖、无法把 Java 侧压到 17；仓库本身也要求 JDK 21。
    jvmTargetVersion = '21'
}